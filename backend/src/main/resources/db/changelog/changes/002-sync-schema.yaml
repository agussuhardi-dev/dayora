databaseChangeLog:
  - changeSet:
      id: 004-create-sync-tables
      author: dayora
      changes:
        - createTable:
            tableName: sync_operation_receipt
            columns:
              - column: {name: owner_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_receipt_owner, references: app_user(id)}}
              - column: {name: operation_id, type: UUID, constraints: {nullable: false}}
              - column: {name: request_hash, type: VARCHAR(128), constraints: {nullable: false}}
              - column: {name: result, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: response_json, type: TEXT, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - addPrimaryKey: {tableName: sync_operation_receipt, columnNames: owner_id, operation_id, constraintName: pk_sync_operation_receipt}
        - createTable:
            tableName: change_log
            columns:
              - column: {name: owner_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_change_owner, references: app_user(id)}}
              - column: {name: sequence, type: BIGINT, constraints: {nullable: false}}
              - column: {name: entity_type, type: VARCHAR(40), constraints: {nullable: false}}
              - column: {name: entity_id, type: UUID, constraints: {nullable: false}}
              - column: {name: operation, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: payload_json, type: TEXT, constraints: {nullable: false}}
              - column: {name: occurred_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - addPrimaryKey: {tableName: change_log, columnNames: owner_id, sequence, constraintName: pk_change_log}
        - createIndex: {tableName: change_log, indexName: idx_change_log_owner_sequence, columns: [{column: {name: owner_id}}, {column: {name: sequence}}]}
        - createTable:
            tableName: sync_cursor_counter
            columns:
              - column: {name: owner_id, type: UUID, constraints: {primaryKey: true, nullable: false, foreignKeyName: fk_counter_owner, references: app_user(id)}}
              - column: {name: next_sequence, type: BIGINT, defaultValueNumeric: 1, constraints: {nullable: false}}
