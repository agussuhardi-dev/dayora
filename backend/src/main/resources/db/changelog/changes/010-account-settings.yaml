databaseChangeLog:
  - changeSet:
      id: 010-account-settings
      author: dayora
      changes:
        - createTable:
            tableName: account_settings
            columns:
              - column: {name: owner_id, type: UUID, constraints: {primaryKey: true, primaryKeyName: pk_account_settings, nullable: false, foreignKeyName: fk_account_settings_owner, references: app_user(id), deleteCascade: true}}
              - column: {name: revision, type: BIGINT, constraints: {nullable: false}}
              - column: {name: settings, type: JSONB, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
