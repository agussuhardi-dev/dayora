databaseChangeLog:
  - changeSet:
      id: 005-create-focus-session-time-entry
      author: dayora
      changes:
        - createTable:
            tableName: focus_session
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: owner_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_focus_owner, references: app_user(id)}}
              - column: {name: task_id, type: UUID}
              - column: {name: state, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: duration_seconds, type: BIGINT, constraints: {nullable: false}}
              - column: {name: active_duration_seconds, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: started_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: running_since, type: TIMESTAMP WITH TIME ZONE}
              - column: {name: ended_at, type: TIMESTAMP WITH TIME ZONE}
        - sql: {sql: "CREATE UNIQUE INDEX uq_focus_active_owner ON focus_session(owner_id) WHERE state IN ('RUNNING','PAUSED')"}
        - createTable:
            tableName: time_entry
            columns:
              - column: {name: id, type: UUID, constraints: {primaryKey: true, nullable: false}}
              - column: {name: owner_id, type: UUID, constraints: {nullable: false, foreignKeyName: fk_time_entry_owner, references: app_user(id)}}
              - column: {name: focus_session_id, type: UUID, constraints: {nullable: false, unique: true, foreignKeyName: fk_time_entry_focus, references: focus_session(id)}}
              - column: {name: task_id, type: UUID}
              - column: {name: duration_seconds, type: BIGINT, constraints: {nullable: false}}
              - column: {name: started_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: ended_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
