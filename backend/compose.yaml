services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayora}
      POSTGRES_USER: ${POSTGRES_USER:-dayora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayora-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dayora-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dayora} -d $${POSTGRES_DB:-dayora}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dayora-postgres:
